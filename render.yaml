services:
  - type: web
    name: atividade-faculdade-gerenciador-tarefas
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/tasks
    envVars:
      - key: NODE_VERSION
        value: 24.13.0
      - key: APP_TIMEZONE
        value: America/Sao_Paulo
